  html+='</div>';
  return html;
}
function renderFitChart(){
  var range=state.fitChartRange||'week';
  var html='<div class="fit-chart-card"><div class="section-header">体脂率变化 \u00b7 Body Fat %</div>';
  html+='<div class="output-filters"><button class="output-filter'+(range==='week'?' active':'')+'" data-action="fit-chart-range" data-value="week">本周</button><button class="output-filter'+(range==='month'?' active':'')+'" data-action="fit-chart-range" data-value="month">本月</button></div>';
  var days=range==='week'?7:30;
  var data=[];
  for(var i=days-1;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=formatDateISO(d);
    var log=state.fitnessLogs[ds];
    if(log&&log.bodyFat)data.push({date:ds,value:log.bodyFat});
  }
  if(data.length<2){
    var w=300,h=140,padL=30,padR=10,padT=10,padB=24;
    var chartW=w-padL-padR,chartH=h-padT-padB;
    html+='<svg class="fit-chart-svg" viewBox="0 0 '+w+' '+h+'">';
    html+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    html+='<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(padL+chartW)+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    for(var gi=0;gi<=5;gi++){
      var gy=padT+chartH-(gi/5)*chartH;
      var gv=(15+gi*2);
      html+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+chartW)+'" y2="'+gy+'" stroke="var(--border-2)" stroke-width="0.5" stroke-dasharray="2,3"/>';
      html+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="var(--text-3)">'+gv+'%</text>';
    }
    var todayLbl=new Date();
    for(var di=0;di<days;di++){
      var dd=new Date();dd.setDate(dd.getDate()-(days-1-di));
      var dx=padL+(days===1?chartW/2:chartW*di/(days-1));
      var dlbl=(dd.getMonth()+1)+'/'+dd.getDate();
      if(days<=7||di%Math.ceil(days/6)===0||di===days-1){
        html+='<text x="'+dx+'" y="'+(h-6)+'" text-anchor="middle" font-size="8" fill="var(--text-3)">'+dlbl+'</text>';
      }
    }
    if(data.length===1){
      var single=data[0];
      var sx=padL+chartW/2;
      var sy=padT+chartH-(single.value-15)/12*chartH;
      html+='<circle cx="'+sx+'" cy="'+sy+'" r="4" fill="var(--accent)"/>';
      html+='<text x="'+sx+'" y="'+(sy-8)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--accent)">'+single.value+'%</text>';
    }
    html+='</svg>';
    if(data.length===0)html+='<p style="text-align:center;font-size:12px;color:var(--text-3);padding:8px 0">暂无体脂数据，填写后自动生成折线</p>';
    html+='</div>';
  }else{
  var minV=Math.min.apply(null,data.map(function(d){return d.value}))-1;
  var maxV=Math.max.apply(null,data.map(function(d){return d.value}))+1;
  var rangeV=maxV-minV||1;
  var w=300,h=140,padL=30,padR=10,padT=10,padB=24;
  var chartW=w-padL-padR,chartH=h-padT-padB;
  var pts='';
  var dots='';
  var labels='';
  for(var j=0;j<data.length;j++){
    var x=padL+(data.length===1?chartW/2:chartW*j/(data.length-1));
    var y=padT+chartH-(data[j].value-minV)/rangeV*chartH;
    pts+=(j===0?'':' ')+' '+x+','+y;
    dots+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="var(--accent)"/>';
    if(j===0||j===data.length-1||data.length<=7){
      var dt=new Date(data[j].date+'T00:00:00');
      var lbl=(dt.getMonth()+1)+'/'+dt.getDate();
      labels+='<text x="'+x+'" y="'+(h-6)+'" text-anchor="middle" font-size="9" fill="var(--text-3)">'+lbl+'</text>';
    }
    if(j===0||j===data.length-1){
      var anchor=j===0?'start':'end';
      dots+='<text x="'+x+'" y="'+(y-6)+'" text-anchor="'+anchor+'" font-size="10" font-weight="700" fill="var(--text)">'+data[j].value+'%</text>';
    }
  }
  var latest=data[data.length-1].value;
  var first=data[0].value;
  var diff=latest-first;
  var diffStr=diff>0?'+'+diff.toFixed(1):diff.toFixed(1);
  var diffColor=diff<0?'var(--green)':diff>0?'var(--red)':'var(--text-2)';
  html+='<svg class="fit-chart-svg" viewBox="0 0 '+w+' '+h+'">';
  html+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
  html+='<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(padL+chartW)+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
  for(var gi=0;gi<=5;gi++){
    var gy=padT+chartH-(gi/5)*chartH;
    var gv=(minV+gi/5*rangeV).toFixed(1);
    html+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+chartW)+'" y2="'+gy+'" stroke="var(--border-2)" stroke-width="0.5" stroke-dasharray="2,3"/>';
    html+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="var(--text-3)">'+gv+'%</text>';
  }
  html+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  html+=dots+labels;
  html+='</svg>';
  html+='<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-2)"><div><span style="font-size:11px;color:var(--text-3)">当前</span><br><span style="font-size:18px;font-weight:700;color:var(--accent)">'+latest+'%</span></div><div><span style="font-size:11px;color:var(--text-3)">'+(range==='week'?'本周':'本月')+'变化</span><br><span style="font-size:18px;font-weight:700;color:'+diffColor+'">'+diffStr+'%</span></div><div><span style="font-size:11px;color:var(--text-3)">记录天数</span><br><span style="font-size:18px;font-weight:700;color:var(--text)">'+data.length+'</span></div></div>';
  html+='</div>';
  }
  var weightData=[];
  for(var k=days-1;k>=0;k--){
    var wd=new Date();wd.setDate(wd.getDate()-k);
    var wds=formatDateISO(wd);
    var wlog=state.fitnessLogs[wds];
    if(wlog&&wlog.weight)weightData.push({date:wds,value:wlog.weight});
  }
  if(weightData.length>=2){
    html+='<div class="fit-chart-card"><div class="section-header">体重变化 \u00b7 Weight (kg)</div>';
    var wMin=Math.min.apply(null,weightData.map(function(d){return d.value}))-1;
    var wMax=Math.max.apply(null,weightData.map(function(d){return d.value}))+1;
    var wRange=wMax-wMin||1;
    var wPts='',wDots='',wLabels='';
    for(var m=0;m<weightData.length;m++){
      var wx=padL+(weightData.length===1?chartW/2:chartW*m/(weightData.length-1));
      var wy=padT+chartH-(weightData[m].value-wMin)/wRange*chartH;
      wPts+=(m===0?'':' ')+' '+wx+','+wy;
      wDots+='<circle cx="'+wx+'" cy="'+wy+'" r="3" fill="#FF9F0A"/>';
      if(m===0||m===weightData.length-1||weightData.length<=7){
        var wdt=new Date(weightData[m].date+'T00:00:00');
        wLabels+='<text x="'+wx+'" y="'+(h-6)+'" text-anchor="middle" font-size="9" fill="var(--text-3)">'+(wdt.getMonth()+1)+'/'+wdt.getDate()+'</text>';
      }
      if(m===0||m===weightData.length-1){
        var wAnchor=m===0?'start':'end';
        wDots+='<text x="'+wx+'" y="'+(wy-6)+'" text-anchor="'+wAnchor+'" font-size="10" font-weight="700" fill="var(--text)">'+weightData[m].value+'kg</text>';
      }
    }
    var wLatest=weightData[weightData.length-1].value;
    var wFirst=weightData[0].value;
    var wDiff=wLatest-wFirst;
    var wDiffStr=wDiff>0?'+'+wDiff.toFixed(1):wDiff.toFixed(1);
    var wDiffColor=wDiff<0?'var(--green)':wDiff>0?'var(--red)':'var(--text-2)';
    html+='<svg class="fit-chart-svg" viewBox="0 0 '+w+' '+h+'">';
    html+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    html+='<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(padL+chartW)+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    for(var gi=0;gi<=5;gi++){
      var gy=padT+chartH-(gi/5)*chartH;
      var gv=(wMin+gi/5*wRange).toFixed(1);
      html+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+chartW)+'" y2="'+gy+'" stroke="var(--border-2)" stroke-width="0.5" stroke-dasharray="2,3"/>';
      html+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="var(--text-3)">'+gv+'</text>';
    }
    html+='<polyline points="'+wPts+'" fill="none" stroke="#FF9F0A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    html+=wDots+wLabels;
    html+='</svg>';
    html+='<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-2)"><div><span style="font-size:11px;color:var(--text-3)">当前</span><br><span style="font-size:18px;font-weight:700;color:#FF9F0A">'+wLatest+'kg</span></div><div><span style="font-size:11px;color:var(--text-3)">'+(range==='week'?'本周':'本月')+'变化</span><br><span style="font-size:18px;font-weight:700;color:'+wDiffColor+'">'+wDiffStr+'kg</span></div><div><span style="font-size:11px;color:var(--text-3)">7日均值</span><br><span style="font-size:18px;font-weight:700;color:var(--text)">'+(get7DayAvgWeight()!==null?get7DayAvgWeight():'-')+'kg</span></div></div>';
    html+='</div>';
  }else if(weightData.length===1){
    html+='<div class="fit-chart-card"><div class="section-header">体重变化 \u00b7 Weight (kg)</div>';
    html+='<svg class="fit-chart-svg" viewBox="0 0 '+w+' '+h+'">';
    html+='<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    html+='<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(padL+chartW)+'" y2="'+(padT+chartH)+'" stroke="var(--border)" stroke-width="1"/>';
    for(var gi=0;gi<=5;gi++){
      var gy=padT+chartH-(gi/5)*chartH;
      var gv=(50+gi*10);
      html+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+chartW)+'" y2="'+gy+'" stroke="var(--border-2)" stroke-width="0.5" stroke-dasharray="2,3"/>';
      html+='<text x="'+(padL-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="var(--text-3)">'+gv+'</text>';
    }
    var swx=padL+chartW/2;
    var swy=padT+chartH-(weightData[0].value-50)/60*chartH;
    html+='<circle cx="'+swx+'" cy="'+swy+'" r="4" fill="#FF9F0A"/>';
    html+='<text x="'+swx+'" y="'+(swy-8)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#FF9F0A">'+weightData[0].value+'kg</text>';
    html+='</svg>';
    html+='<p style="text-align:center;font-size:12px;color:var(--text-3);padding:8px 0">再记录1天即可生成趋势折线</p>';
    html+='</div>';
  }
  return html;
}
function renderHistory(){
  var ds=state.historyDate||getTodayISO();
  var d=new Date(ds+'T00:00:00');
  var approval=getApproval(ds);
  var energy=state.energyHistory[ds];
  var opinion=state.opinionHistory[ds]||'';
  var html='<div class="page history-page">';
  html+='<div class="history-back" data-action="back-from-history">\u2190 返回</div>';
  html+='<div class="history-date">'+formatDateDisplay(d)+'</div>';
  html+='<div class="history-sub">'+(isWeekend(d)?'周末':'工作日')+'</div>';
  var statusIcon=approval==='approved'?'\u2713':approval==='rejected'?'\u2717':'\u2014';
  var statusText=approval==='approved'?'满意 \u00b7 Approved':approval==='rejected'?'不满意 \u00b7 Rejected':'未记录 \u00b7 No Record';
  html+='<div class="history-status"><div class="history-status-icon '+approval+'">'+statusIcon+'</div><span class="history-status-text">'+statusText+'</span></div>';
  if(energy){
    var labels={energy:'Energy 精力',focus:'Focus 专注',mood:'Mood 情绪'};
    html+='<div class="energy-card"><div class="section-header">当日状态</div>';
    ['energy','focus','mood'].forEach(function(k){
      var val=energy[k]||0;
      html+='<div class="energy-row"><span class="energy-label">'+labels[k]+'</span><div class="energy-dots">';
      for(var i=1;i<=5;i++)html+='<div class="energy-dot'+(i<=val?' active':'')+'"></div>';
      html+='</div></div>';
    });
    html+='</div>';
  }
  if(opinion){
    html+='<div class="opinion-card"><div class="section-header">当日观点</div><p style="font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap">'+opinion+'</p></div>';
  }
  var dayExtras=state.opinionExtras&&state.opinionExtras[ds]?state.opinionExtras[ds]:[];
  for(var ei=0;ei<dayExtras.length;ei++){
    if(dayExtras[ei].text&&dayExtras[ei].text.trim()){
      html+='<div class="opinion-card"><div class="section-header">补充想法 '+(ei+1)+'</div><p style="font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap">'+dayExtras[ei].text+'</p></div>';
    }
  }
  var taskHist=state.taskHistory[ds];
  if(taskHist){
    if(taskHist.day&&taskHist.day.length>0){
      html+='<div class="history-task-section"><div class="section-header">白天任务</div><ul class="history-task-list">';
      for(var i=0;i<taskHist.day.length;i++){
        var t=taskHist.day[i];
        var cat=findCat('day',t.category);
        var catName=cat?cat.name:'';
        html+='<li class="history-task-item"><div class="history-task-check '+(t.completed?'done':'undone')+'">'+(t.completed?'\u2713':'')+'</div><span>'+t.title+'</span>'+(catName?'<span class="task-badge" style="background:#F2F2F7;color:#6E6E73">'+catName+'</span>':'')+'</li>';
      }
      html+='</ul></div>';
    }
    if(taskHist.night&&taskHist.night.length>0){
      html+='<div class="history-task-section"><div class="section-header">晚上任务</div><ul class="history-task-list">';
      for(var j=0;j<taskHist.night.length;j++){
        var tn=taskHist.night[j];
        var ncat=findCat('night',tn.category);
        var ncatName=ncat?ncat.name:'';
        html+='<li class="history-task-item"><div class="history-task-check '+(tn.completed?'done':'undone')+'">'+(tn.completed?'\u2713':'')+'</div><span>'+tn.title+'</span>'+(ncatName?'<span class="task-badge" style="background:#F2F2F7;color:#6E6E73">'+ncatName+'</span>':'')+'</li>';
      }
      html+='</ul></div>';
    }
  }
  var dayOutputs=state.outputs.filter(function(o){return o.date===ds});
  if(dayOutputs.length>0){
    html+='<div class="history-task-section"><div class="section-header">当日成果</div>';
    for(var k=0;k<dayOutputs.length;k++){
      html+='<div class="history-task-item"><div class="history-task-check done">\u2713</div><span>'+dayOutputs[k].title+'</span><span class="task-badge" style="background:#F2F2F7;color:#6E6E73">'+dayOutputs[k].type+'</span></div>';
    }
    html+='</div>';
  }
  var fitLog=state.fitnessLogs[ds];
  if(fitLog&&(fitLog.completed||fitLog.status||fitLog.weight||fitLog.bodyFat||fitLog.muscle||(fitLog.exercises&&Object.keys(fitLog.exercises).length>0))){
    html+='<div class="history-task-section"><div class="section-header">训练记录</div>';
    if(fitLog.completed)html+='<div class="history-task-item"><div class="history-task-check done">\u2713</div><span>训练完成</span>'+(fitLog.status?'<span class="task-badge" style="background:#F2F2F7;color:#6E6E73">'+{good:'\u{1F7E2} 好',average:'\u{1F7E1} 一般',poor:'\u{1F534} 差'}[fitLog.status]+'</span>':'')+'</div>';
    if(fitLog.weight)html+='<div class="history-task-item"><span style="color:var(--text-3);font-size:12px;width:60px">体重</span><span>'+(fitLog.weight||'-')+' kg</span></div>';
    if(fitLog.bodyFat)html+='<div class="history-task-item"><span style="color:var(--text-3);font-size:12px;width:60px">体脂率</span><span>'+(fitLog.bodyFat||'-')+'%</span></div>';
    if(fitLog.muscle)html+='<div class="history-task-item"><span style="color:var(--text-3);font-size:12px;width:60px">骨骼肌</span><span>'+(fitLog.muscle||'-')+' kg</span></div>';
    if(fitLog.cardioNote)html+='<div class="history-task-item"><span style="color:var(--text-3);font-size:12px;width:60px">有氧</span><span style="font-size:12px">'+fitLog.cardioNote+'</span></div>';
    html+='<div style="text-align:center;padding:6px 0"><span class="fit-link" data-action="go-fit" style="font-size:12px;font-weight:600;color:var(--accent);cursor:pointer">\u{1F3CB} 前往Fit查看详情 \u2192</span></div>';
    html+='</div>';
  }
  if(!energy&&!opinion&&!taskHist&&dayOutputs.length===0&&!fitLog){
    html+='<div class="history-empty">这一天没有更多记录</div>';
  }
  html+='</div>';return html;
}

/* ===== ACTIONS ===== */
function navigate(page){state.currentPage=page;saveState();render();window.scrollTo(0,0)}
function toggleTask(type,id){var tasks=state.tasks[type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].completed=!tasks[i].completed;break}}saveState();render()}
function deleteTask(type,id){var tasks=state.tasks[type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks.splice(i,1);break}}saveState();render()}
function editTask(type,id){state.editingTaskId=id;render();requestAnimationFrame(function(){var inp=document.querySelector('.task-edit-input');if(inp)inp.focus()})}
function cancelTaskEdit(){state.editingTaskId=null;render()}
function saveTaskEdit(type,id){
  var inp=document.querySelector('.task-edit-input[data-id="'+id+'"]');
  if(!inp){state.editingTaskId=null;render();return}
  var val=inp.value.trim();
  if(val){var tasks=state.tasks[type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].title=val;break}}}
  state.editingTaskId=null;saveState();render();
}
function filterMemo(val){state.memoFilter=val;saveState();render()}
function openAddForm(type,category){state.addForm={type:type,category:category,priority:'should',title:''};render();requestAnimationFrame(function(){var inp=document.querySelector('.add-task-input');if(inp)inp.focus()})}
function closeAddForm(){state.addForm={type:null,category:null,priority:'should',title:''};render()}
function selectPriority(val){state.addForm.priority=val;render();requestAnimationFrame(function(){var inp=document.querySelector('.add-task-input');if(inp){inp.focus();var len=inp.value.length;inp.setSelectionRange(len,len)}})}
function selectPreset(val){state.addForm.title=val;render();requestAnimationFrame(function(){var inp=document.querySelector('.add-task-input');if(inp){inp.focus();var len=inp.value.length;inp.setSelectionRange(len,len)}})}
function addTaskFromForm(){
  var f=state.addForm;if(!f.title||!f.title.trim())return;
  var tasks=state.tasks[f.type];
  tasks.push({id:uid(),category:f.category,title:f.title.trim(),priority:f.priority,completed:false});
  state.addForm={type:null,category:null,priority:'should',title:''};
  saveState();render();
}
function toggleRecovery(){state.recoveryMode=!state.recoveryMode;saveState();render()}
function setEnergy(type,val){state.energy[type]=val;saveDailyEnergy();saveState();render()}
function setApproval(val){
  var today=getTodayISO();
  if(state.dailyApproval[today]===val){delete state.dailyApproval[today]}else{state.dailyApproval[today]=val}
  saveState();render();
}
function switchReviewTab(val){state.reviewTab=val;saveState();render()}
function filterOutput(val){state.outputFilter=val;saveState();render()}
function openAddOutput(){state.addOutputOpen=true;state.newOutput={type:'工作',title:'',desc:''};render();requestAnimationFrame(function(){var s=document.querySelector('.output-type-select');if(s)s.focus()})}
function closeAddOutput(){state.addOutputOpen=false;render()}
function addOutput(){
  var n=state.newOutput;if(!n.title||!n.title.trim())return;
  state.outputs.unshift({id:uid(),type:n.type,title:n.title.trim(),desc:n.desc||'',date:formatDateISO(new Date())});
  state.addOutputOpen=false;state.newOutput={type:'工作',title:'',desc:''};
  saveState();render();
}
function navigateMonth(delta){
  state.calendarMonth+=delta;
  if(state.calendarMonth<0){state.calendarMonth=11;state.calendarYear--}
  if(state.calendarMonth>11){state.calendarMonth=0;state.calendarYear++}
  saveState();render();
}
function viewHistoryDay(dateISO){state.historyDate=dateISO;state.currentPage='history';saveState();render();window.scrollTo(0,0)}
function backFromHistory(){state.currentPage='review';saveState();render();window.scrollTo(0,0)}
function setGrowthView(val){state.growthView=val;saveState();render()}
function addBelief(){
  var text=(state.beliefDraft||'').trim();if(!text)return;
  state.beliefs.push({id:uid(),text:text,date:getTodayISO(),outdated:false});
  state.beliefDraft='';saveState();render();
}
function toggleBeliefOutdated(id){
  for(var i=0;i<state.beliefs.length;i++){
    if(state.beliefs[i].id===id){state.beliefs[i].outdated=!state.beliefs[i].outdated;break}
  }
  saveState();render();
}
function startDialogue(){
  var entries=[];
  var oh=state.opinionHistory||{};
  for(var ds in oh){
    var text=oh[ds];
    if(text&&text.trim()&&ds!==getTodayISO())entries.push({date:ds,text:text.trim()});
  }
  var ta=state.top3Archive||[];
  for(var i=0;i<ta.length;i++){
    if(ta[i].content&&ta[i].content.trim())entries.push({date:ta[i].date,text:ta[i].content.trim()});
  }
  if(entries.length===0)return;
  var pick=entries[Math.floor(Math.random()*entries.length)];
  state.dialogueDraft={originalDate:pick.date,originalText:pick.text,replyText:''};
  saveState();render();
}
function saveDialogueReply(){
  var d=state.dialogueDraft;if(!d)return;
  var inp=document.querySelector('[data-input="dialogue-reply"]');
  var reply=inp?inp.value.trim():'';
  if(!reply){state.dialogueDraft=null;render();return}
  state.dialogues.push({originalDate:d.originalDate,originalText:d.originalText,replyDate:getTodayISO(),replyText:reply});
  state.dialogueDraft=null;saveState();render();
}
function cancelDialogue(){state.dialogueDraft=null;saveState();render()}
function addConflict(){
  var d=state.conflictDraft||{want:'',but:'',because:''};
  if(!d.want.trim()||!d.but.trim())return;
  state.conflicts.push({id:uid(),want:d.want.trim(),but:d.but.trim(),because:(d.because||'').trim(),date:getTodayISO()});
  state.conflictDraft={want:'',but:'',because:''};saveState();render();
}
function toggleFitComplete(){
  var log=getFitLog();
  log.completed=!log.completed;
  if(log.completed){
    var day=getFitnessDay();
    var tpl=getTodayTemplate();
    var hasExisting=false;
    for(var i=0;i<state.outputs.length;i++){
      if(state.outputs[i].date===getTodayISO()&&state.outputs[i].type==='\u5065\u8eab'&&state.outputs[i].title.indexOf(tpl.label)>=0){hasExisting=true;break}
    }
    if(!hasExisting){
      var doneCount=0;
      if(log.exerciseDone)for(var k in log.exerciseDone){if(log.exerciseDone[k])doneCount++}
      var totalEx=tpl.exercises?tpl.exercises.length:0;
      state.outputs.unshift({id:uid(),type:'\u5065\u8eab',title:'Day '+day+' \u00b7 '+tpl.label,desc:'\u5b8c\u6210 '+doneCount+'/'+totalEx+' \u4e2a\u52a8\u4f5c\uff0c\u72b6\u6001\uff1a'+(log.status?{good:'\u{1F7E2}\u597d',average:'\u{1F7E1}\u4e00\u822c',poor:'\u{1F534}\u5dee'}[log.status]:'\u672a\u8bb0\u5f55'),date:formatDateISO(new Date())});
    }
  }
  saveState();render();
}
function toggleExercise(exId,dateStr){
  var log=getFitLog(dateStr);
  if(!log.exerciseDone)log.exerciseDone={};
  log.exerciseDone[exId]=!log.exerciseDone[exId];
  saveState();render();
}
function setFitStatus(status,dateStr){
  var log=getFitLog(dateStr);
  log.status=log.status===status?null:status;
  saveState();render();
}
function changeFitTemplate(dayNum,tplKey){
  if(!state.fitOverrides)state.fitOverrides={};
  if(state.fitOverrides[dayNum]===tplKey||(!state.fitOverrides[dayNum]&&FITNESS_DAY_MAP[dayNum]===tplKey)){
    delete state.fitOverrides[dayNum];
  }else{
    state.fitOverrides[dayNum]=tplKey;
  }
  saveState();render();
}

/* ===== EVENT HANDLERS ===== */
function handleClick(e){
  var navItem=e.target.closest('[data-nav]');
  if(navItem){navigate(navItem.getAttribute('data-nav'));return}
  var el=e.target.closest('[data-action]');if(!el)return;
  var action=el.getAttribute('data-action');var ds=el.dataset;
  switch(action){
    case 'toggle-task':toggleTask(ds.type,ds.id);break;
    case 'delete-task':deleteTask(ds.type,ds.id);break;
    case 'edit-task':editTask(ds.type,ds.id);break;
    case 'save-task-edit':saveTaskEdit(ds.type,ds.id);break;
    case 'cancel-task-edit':cancelTaskEdit();break;
    case 'open-add-form':openAddForm(ds.type,ds.category);break;
    case 'close-add-form':closeAddForm();break;
    case 'add-task':addTaskFromForm();break;
    case 'select-priority':selectPriority(ds.value);break;
    case 'select-preset':selectPreset(ds.value);break;
    case 'set-energy':setEnergy(ds.energyType,parseInt(ds.value));break;
    case 'set-approval':setApproval(ds.value==='true');break;
    case 'nav-review-tab':switchReviewTab(ds.value);break;
    case 'filter-memo':filterMemo(ds.value);break;
    case 'filter-output':filterOutput(ds.value);break;
    case 'open-add-output':openAddOutput();break;
    case 'close-add-output':closeAddOutput();break;
    case 'add-output':addOutput();break;
    case 'prev-month':navigateMonth(-1);break;
    case 'next-month':navigateMonth(1);break;
    case 'view-history':viewHistoryDay(ds.date);break;
    case 'back-from-history':backFromHistory();break;
    case 'growth-view':setGrowthView(ds.value);break;
    case 'add-belief':addBelief();break;
    case 'toggle-belief-outdated':toggleBeliefOutdated(ds.id);break;
    case 'start-dialogue':startDialogue();break;
    case 'save-dialogue-reply':saveDialogueReply();break;
    case 'cancel-dialogue':cancelDialogue();break;
    case 'add-conflict':addConflict();break;
    case 'toggle-fit-complete':toggleFitComplete();break;
    case 'fit-view':state.fitView=ds.value;state.fitViewDay=null;render();window.scrollTo(0,0);break;
    case 'view-fit-day':state.fitView='day-detail';state.fitViewDay=parseInt(ds.day);render();window.scrollTo(0,0);break;
    case 'fit-back-to-calendar':state.fitView='calendar';state.fitViewDay=null;render();window.scrollTo(0,0);break;
    case 'toggle-exercise':toggleExercise(ds.ex,ds.date);break;
    case 'set-fit-status':setFitStatus(ds.status,ds.date);break;
    case 'fit-chart-range':state.fitChartRange=ds.value;saveState();render();break;
    case 'go-fit':navigate('fit');break;
    case 'go-growth':state.growthView='output';navigate('growth');break;
    case 'go-fit-today':state.fitView='today';navigate('fit');break;
    case 'go-day':navigate('day');break;
    case 'add-opinion-extra':addOpinionExtra();break;
    case 'delete-opinion-extra':deleteOpinionExtra(ds.value);break;
    case 'go-review':navigate('review');break;
    case 'day-sub-tab':state.daySubView=ds.value;state.bookView='list';saveState();render();break;
    case 'add-book-form':state.bookView='add';saveState();render();break;
    case 'book-view':state.bookView=ds.value;state.bookDetailId=null;saveState();render();break;
    case 'view-book':state.bookDetailId=ds.value;state.bookView='detail';saveState();render();break;
    case 'submit-book':submitBook();break;
    case 'save-book-progress':saveBookProgress(ds.value);break;
    case 'delete-book':deleteBook(ds.value);break;
    case 'go-book':state.daySubView='book';state.bookView='list';navigate('day');break;
    case 'go-book-detail':state.daySubView='book';state.bookView='detail';state.bookDetailId=ds.value;navigate('day');break;
    case 'go-growth-calendar':state.growthView='calendar';navigate('growth');break;
  }
}
function handleInput(e){
  var el=e.target.closest('[data-input]');if(!el)return;
  var input=el.getAttribute('data-input');var ds=el.dataset;
  switch(input){
    case 'today-opinion':state.todayOpinion=e.target.value;saveDailyOpinion();debouncedSave();break;
    case 'opinion-extra':saveOpinionExtra(ds.value,e.target.value);break;
    case 'add-task-title':state.addForm.title=e.target.value;break;
    case 'memo-search':
      state.memoSearch=e.target.value;
      render();
      requestAnimationFrame(function(){var inp=document.querySelector('.memo-search-input');if(inp){inp.focus();var len=inp.value.length;inp.setSelectionRange(len,len)}});
      break;
    case 'weekly-answer':state.weeklyReview[ds.field]=e.target.value;debouncedSave();break;
    case 'weekly-top3':state.weeklyTop3[ds.index]=e.target.value;debouncedSave();break;
    case 'total-reason':
      for(var i=0;i<state.totalReview.length;i++){if(state.totalReview[i].id===ds.id){state.totalReview[i].reason=e.target.value;debouncedSave();break}}
      break;
    case 'output-type':state.newOutput.type=e.target.value;break;
    case 'output-title':state.newOutput.title=e.target.value;break;
    case 'output-desc':state.newOutput.desc=e.target.value;break;
    case 'belief-draft':state.beliefDraft=e.target.value;debouncedSave();break;
    case 'dialogue-reply':
      if(state.dialogueDraft)state.dialogueDraft.replyText=e.target.value;
      break;
    case 'conflict-want':
      if(!state.conflictDraft)state.conflictDraft={want:'',but:'',because:''};
      state.conflictDraft.want=e.target.value;break;
    case 'conflict-but':
      if(!state.conflictDraft)state.conflictDraft={want:'',but:'',because:''};
      state.conflictDraft.but=e.target.value;break;
    case 'conflict-because':
      if(!state.conflictDraft)state.conflictDraft={want:'',but:'',because:''};
      state.conflictDraft.because=e.target.value;break;
    case 'fit-actual':
      var aLog=getFitLog(ds.date);
      aLog.exercises[ds.ex]=e.target.value;
      debouncedSave();break;
    case 'fit-cardio':
      var cLog=getFitLog(ds.date);
      cLog.cardioNote=e.target.value;debouncedSave();break;
    case 'fit-body':
      var bLog=getFitLog(ds.date);
      bLog[ds.field]=e.target.value?parseFloat(e.target.value):'';debouncedSave();break;
  }
}
function handleChange(e){
  var actionEl=e.target.closest('[data-action]');
  if(actionEl&&actionEl.tagName==='SELECT'){
    var act=actionEl.getAttribute('data-action');var ads=actionEl.dataset;
    if(act==='change-fit-template'){changeFitTemplate(parseInt(ads.day),e.target.value);return}
  }
  var el=e.target.closest('[data-input]');if(!el)return;
  var input=el.getAttribute('data-input');var ds=el.dataset;
  if(input==='total-score'){
    for(var i=0;i<state.totalReview.length;i++){
      if(state.totalReview[i].id===ds.id){
        state.totalReview[i].score=parseInt(e.target.value);
        var valEl=el.parentElement.querySelector('.score-value');
        if(valEl)valEl.textContent=e.target.value;
        debouncedSave();break;
      }
    }
  }
}
function handleKeydown(e){
  if(e.key==='Enter'){
    var el1=e.target.closest('[data-input="add-task-title"]');
    if(el1){e.preventDefault();addTaskFromForm();return}
    if(e.target.classList.contains('output-title-input')){e.preventDefault();addOutput()}
    var el2=e.target.closest('[data-input="edit-task-title"]');
    if(el2){e.preventDefault();var ds=el2.dataset;var val=el2.value.trim();if(val){var tasks=state.tasks[ds.type];for(var i=0;i<tasks.length;i++){if(tasks[i].id===ds.id){tasks[i].title=val;break}}}state.editingTaskId=null;saveState();render();return}
  }
  if(e.key==='Escape'){
    var el3=e.target.closest('[data-input="edit-task-title"]');
    if(el3){cancelTaskEdit();return}
  }
}

/* ===== INIT ===== */
function ensureStateDefaults(){
  if(!state.tasks)state=getDefaultData();
  if(!state.tasks.day)state.tasks.day=[];
  if(!state.tasks.night)state.tasks.night=[];
  if(!state.weeklyReview)state.weeklyReview={};
  if(!state.weeklyTop3)state.weeklyTop3={1:'',2:'',3:''};
  if(!state.top3Archive)state.top3Archive=[];
  if(state.top3LastArchived===undefined)state.top3LastArchived=null;
  if(!state.totalReview)state.totalReview=TOTAL_DIMENSIONS.map(function(d){return{id:d.id,name:d.name,score:d.score,reason:d.reason}});
  if(!state.outputs)state.outputs=[];
  if(!state.energy)state.energy={energy:3,focus:4,mood:4};
  if(!state.dailyApproval)state.dailyApproval={};
  if(!state.energyHistory)state.energyHistory={};
  if(!state.opinionHistory)state.opinionHistory={};
  if(!state.opinionExtras)state.opinionExtras={};
  if(state.addForm===undefined)state.addForm={type:null,category:null,priority:'should',title:''};
  if(state.addOutputOpen===undefined)state.addOutputOpen=false;
  if(!state.newOutput)state.newOutput={type:'工作',title:'',desc:''};
  if(state.outputFilter===undefined)state.outputFilter='all';
  if(state.reviewTab===undefined||state.reviewTab==='total')state.reviewTab='weekly';
  if(state.memoSearch===undefined)state.memoSearch='';
  if(state.memoFilter===undefined)state.memoFilter='all';
  if(state.editingTaskId===undefined)state.editingTaskId=null;
  if(state.calendarYear===undefined){state.calendarYear=new Date().getFullYear();state.calendarMonth=new Date().getMonth()}
  if(state.historyDate===undefined)state.historyDate=null;
  if(state.recoveryMode===undefined)state.recoveryMode=false;
  if(state.currentPage==='night')state.currentPage='day';
  if(state.todayOpinion===undefined)state.todayOpinion='';
  if(!state.taskHistory)state.taskHistory={};
  if(!state.monthlyReports)state.monthlyReports=[];
  if(!state.beliefs)state.beliefs=[];
  if(!state.dialogues)state.dialogues=[];
  if(!state.conflicts)state.conflicts=[];
  if(!state.conflictDraft)state.conflictDraft={want:'',but:'',because:''};
  if(state.dialogueDraft===undefined)state.dialogueDraft=null;
  if(state.growthView===undefined)state.growthView='calendar';
  if(state.fitnessPlan===undefined)state.fitnessPlan=null;
  if(state.fitnessPlanOpen===undefined)state.fitnessPlanOpen=false;
  if(state.beliefDraft===undefined)state.beliefDraft='';
  if(!state.fitnessLogs)state.fitnessLogs={};
  if(state.fitView===undefined)state.fitView='today';
  if(state.fitViewDay===undefined)state.fitViewDay=null;
  if(!state.fitOverrides)state.fitOverrides={};
  if(state.fitChartRange===undefined)state.fitChartRange='week';
  delete state.growthStage;delete state.stageStart;delete state.stageEnd;delete state.monthlyRate;delete state.monthlyReview;
}
function init(){
  ensureStateDefaults();
  archiveDailyTasks();
  checkTop3Archive();
  checkMonthlyReport();
  loadDailyOpinion();
  document.getElementById('app').addEventListener('click',handleClick);
  document.getElementById('app').addEventListener('input',handleInput);
  document.getElementById('app').addEventListener('change',handleChange);
  document.getElementById('app').addEventListener('keydown',handleKeydown);
  document.getElementById('bottom-nav').addEventListener('click',handleClick);
  render();
  if(cloudSyncEnabled){
    var indicator=document.createElement('div');
    indicator.className='sync-indicator';indicator.id='sync-indicator';
    indicator.innerHTML='<div class="sync-dot syncing"></div><span class="sync-text">同步中</span>';
    document.body.appendChild(indicator);
    cloudSyncLoad().then(function(cloudData){
      if(cloudData&&cloudData.tasks){
        state=cloudData;ensureStateDefaults();
        archiveDailyTasks();
        checkTop3Archive();
        checkMonthlyReport();
        loadDailyOpinion();
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
        render();updateSyncStatus('synced');debouncedCloudSync();
      }else{updateSyncStatus('offline')}
    });
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
</body>
